name: Publicar Homologação HML

on:
  workflow_dispatch:
    inputs:
      referencia:
        description: Referência explicitamente autorizada para HML
        required: true
        default: release/v0.1.0-homologacao
        type: string
      tipo_publicacao:
        description: Conteúdo da publicação HML
        required: true
        default: frontend
        type: choice
        options:
          - frontend
          - completo
      confirmacao:
        description: Digite PUBLICAR HML para confirmar
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kersting-gps-homologacao
  cancel-in-progress: false

env:
  ALLOWED_REFS: |
    release/v0.1.0-homologacao
    codex/melhorar-associacao-geocercas
    codex/geofence-prod-clean
  EXPECTED_ENVIRONMENT: homologacao
  EXPECTED_USER: deploy-hml
  EXPECTED_INTERNAL_URL: http://127.0.0.1:18082/
  EXPECTED_PUBLIC_URL: https://gps-hml.kersting.net.br/

jobs:
  publicar:
    name: Publicar ${{ inputs.tipo_publicacao }} somente em HML
    runs-on: ubuntu-latest
    environment: homologacao
    timeout-minutes: 45

    steps:
      - name: Validar autorização e limites HML
        shell: bash
        env:
          INPUT_REF: ${{ inputs.referencia }}
          INPUT_TYPE: ${{ inputs.tipo_publicacao }}
          INPUT_CONFIRMATION: ${{ inputs.confirmacao }}
        run: |
          set -euo pipefail
          [[ "$INPUT_CONFIRMATION" == "PUBLICAR HML" ]] || {
            echo "::error::Confirmação inválida. Nenhuma conexão foi realizada."
            exit 1
          }
          grep -qxF "$INPUT_REF" <<< "$ALLOWED_REFS" || {
            echo "::error::Referência não autorizada para HML: $INPUT_REF"
            exit 1
          }
          [[ "$INPUT_TYPE" == "frontend" || "$INPUT_TYPE" == "completo" ]]
          [[ "$EXPECTED_ENVIRONMENT" == "homologacao" ]]
          [[ "$EXPECTED_USER" == "deploy-hml" ]]
          [[ "$EXPECTED_INTERNAL_URL" == "http://127.0.0.1:18082/" ]]
          [[ "$EXPECTED_PUBLIC_URL" == "https://gps-hml.kersting.net.br/" ]]
          [[ "$EXPECTED_INTERNAL_URL" != "http://127.0.0.1:8082/" ]]
          [[ "$EXPECTED_PUBLIC_URL" != "https://gps.kersting.net.br/" ]]
          printf 'DEPLOY_REF=%s\n' "$INPUT_REF" >> "$GITHUB_ENV"
          printf 'DEPLOY_TYPE=%s\n' "$INPUT_TYPE" >> "$GITHUB_ENV"

      - name: Obter infraestrutura HML aprovada
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Validar segurança do fluxo HML
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            tools/deploy/deploy-kersting-gps-hml.sh \
            tools/deploy/kersting-gps-hml-ssh-gate.sh \
            tools/deploy/kersting-gps-hml-access.sh \
            tools/deploy/install-deploy-hml-user.sh; do
            bash -n "$script"
          done
          python3 tools/deploy/test_deploy_hml_safety.py .

      - name: Obter a referência autorizada em diretório isolado
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.referencia }}
          path: source
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Inicializar frontend no gitlink exato
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_FRONTEND_COMMIT="$(git ls-tree HEAD traccar-web | awk '{print $3}')"
          [[ "$EXPECTED_FRONTEND_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git submodule sync --recursive
          git submodule update --init --recursive || {
            echo "::error::Commit $EXPECTED_FRONTEND_COMMIT do frontend indisponível."
            exit 1
          }
          ACTUAL_FRONTEND_COMMIT="$(git -C traccar-web rev-parse HEAD)"
          [[ "$ACTUAL_FRONTEND_COMMIT" == "$EXPECTED_FRONTEND_COMMIT" ]] || exit 1
          MAIN_COMMIT="$(git rev-parse HEAD)"
          printf 'MAIN_COMMIT=%s\n' "$MAIN_COMMIT" >> "$GITHUB_ENV"
          printf 'FRONTEND_COMMIT=%s\n' "$ACTUAL_FRONTEND_COMMIT" >> "$GITHUB_ENV"

      - name: Preparar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/traccar-web/package-lock.json

      - name: Validar e compilar frontend
        working-directory: source/traccar-web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run build
          test -s build/index.html

      - name: Preparar Java 21
        if: env.DEPLOY_TYPE == 'completo'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Compilar backend
        if: env.DEPLOY_TYPE == 'completo'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assemble --no-daemon --stacktrace
          test -s target/tracker-server.jar
          test -d target/lib

      - name: Validar migrations do pacote completo
        if: env.DEPLOY_TYPE == 'completo'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          schema = Path('schema').resolve()
          master = schema / 'changelog-master.xml'
          namespace = {'db': 'http://www.liquibase.org/xml/ns/dbchangelog'}
          includes = [node.attrib['file'] for node in ET.parse(master).getroot().findall('db:include', namespace)]
          if not includes:
              raise SystemExit('changelog-master.xml sem includes')
          missing = [item for item in includes if not (schema / item).is_file()]
          if missing:
              raise SystemExit(f'Migrations ausentes: {missing}')
          print(f'{len(includes)} migrations presentes.')
          PY

      - name: Criar pacote HML e manifesto rastreável
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="$RUNNER_TEMP/kersting-hml-package"
          ARCHIVE_NAME="kersting-gps-hml-${MAIN_COMMIT}-${DEPLOY_TYPE}.tar.gz"
          ARCHIVE_PATH="$RUNNER_TEMP/$ARCHIVE_NAME"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/web"
          cp -a source/traccar-web/build/. "$PACKAGE_DIR/web/"
          if [[ "$DEPLOY_TYPE" == "completo" ]]; then
            cp source/target/tracker-server.jar "$PACKAGE_DIR/tracker-server.jar"
            cp -a source/target/lib "$PACKAGE_DIR/lib"
            cp -a source/schema "$PACKAGE_DIR/schema"
          fi
          {
            printf 'main_commit=%s\n' "$MAIN_COMMIT"
            printf 'frontend_commit=%s\n' "$FRONTEND_COMMIT"
            printf 'type=%s\n' "$DEPLOY_TYPE"
            printf 'ref=%s\n' "$DEPLOY_REF"
            printf 'built_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'run_url=https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'release=%s\n' "$MAIN_COMMIT"
          } > "$PACKAGE_DIR/deploy-info"
          tar -C "$PACKAGE_DIR" -czf "$ARCHIVE_PATH" .
          printf 'ARCHIVE_NAME=%s\n' "$ARCHIVE_NAME" >> "$GITHUB_ENV"
          printf 'ARCHIVE_PATH=%s\n' "$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "SHA-256: $(sha256sum "$ARCHIVE_PATH" | awk '{print $1}')"

      - name: Configurar SSH exclusivo da HML
        shell: bash
        env:
          HML_VPS_HOST: ${{ secrets.HML_VPS_HOST }}
          HML_VPS_PORT: ${{ secrets.HML_VPS_PORT }}
          HML_VPS_USER: ${{ secrets.HML_VPS_USER }}
          HML_VPS_SSH_KEY: ${{ secrets.HML_VPS_SSH_KEY }}
          HML_VPS_KNOWN_HOSTS: ${{ secrets.HML_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$HML_VPS_HOST" && -n "$HML_VPS_SSH_KEY" && -n "$HML_VPS_KNOWN_HOSTS" ]]
          [[ "$HML_VPS_USER" == "deploy-hml" ]]
          [[ "$HML_VPS_PORT" =~ ^[0-9]{1,5}$ ]] && (( HML_VPS_PORT >= 1 && HML_VPS_PORT <= 65535 ))
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$HML_VPS_SSH_KEY" > "$HOME/.ssh/deploy_hml_key"
          printf '%s\n' "$HML_VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_hml_key" "$HOME/.ssh/known_hosts"

      - name: Confirmar acesso ativado e serviços HML
        shell: bash
        env:
          HML_VPS_HOST: ${{ secrets.HML_VPS_HOST }}
          HML_VPS_PORT: ${{ secrets.HML_VPS_PORT }}
          HML_VPS_USER: ${{ secrets.HML_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -p "$HML_VPS_PORT" -i "$HOME/.ssh/deploy_hml_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HML_VPS_USER@$HML_VPS_HOST" status

      - name: Enviar pacote pelo gate restrito
        shell: bash
        env:
          HML_VPS_HOST: ${{ secrets.HML_VPS_HOST }}
          HML_VPS_PORT: ${{ secrets.HML_VPS_PORT }}
          HML_VPS_USER: ${{ secrets.HML_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -p "$HML_VPS_PORT" -i "$HOME/.ssh/deploy_hml_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HML_VPS_USER@$HML_VPS_HOST" "upload $ARCHIVE_NAME" < "$ARCHIVE_PATH"

      - name: Publicar e validar somente HML
        shell: bash
        env:
          HML_VPS_HOST: ${{ secrets.HML_VPS_HOST }}
          HML_VPS_PORT: ${{ secrets.HML_VPS_PORT }}
          HML_VPS_USER: ${{ secrets.HML_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -p "$HML_VPS_PORT" -i "$HOME/.ssh/deploy_hml_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HML_VPS_USER@$HML_VPS_HOST" deploy
          curl --fail --silent --show-error --location --max-time 20 "$EXPECTED_PUBLIC_URL" >/dev/null

      - name: Limpar entrada HML
        if: always() && env.ARCHIVE_NAME != ''
        continue-on-error: true
        shell: bash
        env:
          HML_VPS_HOST: ${{ secrets.HML_VPS_HOST }}
          HML_VPS_PORT: ${{ secrets.HML_VPS_PORT }}
          HML_VPS_USER: ${{ secrets.HML_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -p "$HML_VPS_PORT" -i "$HOME/.ssh/deploy_hml_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HML_VPS_USER@$HML_VPS_HOST" cleanup

      - name: Remover credenciais do runner
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/deploy_hml_key" "$HOME/.ssh/known_hosts"
